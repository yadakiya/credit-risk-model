name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        # --max-line-length=120 allows lines up to 120 characters instead of 79
        run: flake8 src tests dashboard --max-line-length=120

      - name: Run tests
        # 'python -m pytest' ensures your project root directory is added to Python's sys.path
        run: python -m pytest -v --tb=short